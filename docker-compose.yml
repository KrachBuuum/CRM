
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: crm_admin
      POSTGRES_PASSWORD: HeroeS88
      POSTGRES_DB: crm_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_admin -d crm_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=crm_admin
      - DB_PASSWORD=HeroeS88
      - DB_NAME=crm_production
      - JWT_SECRET=HeroeS93
      - BACKEND_PORT=3000
      - API_KEY=${API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
